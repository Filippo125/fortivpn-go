charon {
 load_modular = yes
 port = 15000
 port_nat_t = 4500
 keep_alive = 0
 plugins {
  include strongswan.d/charon/*.conf
  kernel-libipsec { load = 100 }
  socket-default { use_ipv6 = no }
  vici { socket = unix:///var/run/charon.vici }
 }
 filelog {
  stderr {
   default = 1
   flush_line = yes
  }
 }
}
