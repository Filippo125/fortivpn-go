name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  platform-tests:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run native tests
        run: go test -count=1 ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs:
      - quality
      - platform-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            binary: fortivpn-darwin-arm64
            archive: fortivpn-darwin-arm64.tar.gz
          - goos: linux
            goarch: amd64
            binary: fortivpn-linux-amd64
            archive: fortivpn-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: fortivpn-linux-arm64
            archive: fortivpn-linux-arm64.tar.gz
#          - goos: windows
#            goarch: amd64
#            binary: fortivpn-windows-amd64.exe
#            archive: fortivpn-windows-amd64.zip
#          - goos: windows
#            goarch: arm64
#            binary: fortivpn-windows-arm64.exe
#            archive: fortivpn-windows-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          BINARY: ${{ matrix.binary }}
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "dist/${BINARY}" ./cmd/fortivpn

      - name: Package binary and checksum
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
          TARGET_OS: ${{ matrix.goos }}
        run: |
          if [[ "${TARGET_OS}" == "windows" ]]; then
            (cd dist && zip -q "${ARCHIVE}" "${BINARY}")
          else
            tar -C dist -czf "dist/${ARCHIVE}" "${BINARY}"
          fi
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
